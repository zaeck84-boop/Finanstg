function b64e(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const TE=new TextEncoder(),TD=new TextDecoder();
const aesKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encStr(dk,str){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(dk),TE.encode(str)));return'v1.'+b64e(iv)+'.'+b64e(ct)}
async function decStr(dk,blob){const[v,iv,ct]=String(blob).split('.');if(v!=='v1')throw Error('format');return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},await aesKey(dk),b64d(ct)))}
const RC_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newRecovery(){const r=crypto.getRandomValues(new Uint8Array(24));let s='';for(const x of r)s+=RC_ABC[x&31];return s.match(/.{4}/g).join('-')}
const normRC=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function rcDerive(rc,salt){const base=await crypto.subtle.importKey('raw',TE.encode(normRC(rc)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrapDK(dk,rc){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await rcDerive(rc,salt),dk));return'w1.'+b64e(salt)+'.'+b64e(iv)+'.'+b64e(ct)}
async function unwrapDK(w,rc){const[v,s,iv,ct]=String(w).split('.');if(v!=='w1')throw Error('format');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},await rcDerive(rc,b64d(s)),b64d(ct)))}
async function sapi(method,body){
  const r=await fetch(SYNC.url.replace(/\/+$/,'')+'/api/vault',{method,headers:{Authorization:'tma '+SYNC.auth(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===404)return null;if(r.status===204)return true;if(r.ok)return r.json();
  const e=new Error('http '+r.status);e.code=r.status;throw e}
function normS(){S.budgets=S.budgets||{};S.goals=S.goals||[];S.learn=S.learn||{};S.bills=S.bills||[];S.settings=S.settings||{};S.txs=S.txs||[];S.accounts=S.accounts||[];S.cats=S.cats||[]}

const syncErr=e=>e&&e.code===401?'Откройте приложение заново, чтобы обновить вход':'Нет связи с сервером, изменения сохранятся позже';
async function syncInit(){if(!SYNC.url)return;
  try{const k=await kvGet('k1'),m=JSON.parse((await kvGet('m1'))||'{}');SY.ver=m.ver||0;SY.dirty=!!m.dirty;
    if(k){SY.dk=b64d(k);SY.on=true;await pull()}else{const v=await sapi('GET');SY.remote=!!v}}
  catch(e){SY.status=syncErr(e)}}
async function applyRemote(v){const data=JSON.parse(await decStr(SY.dk,v.blob));S=data;normS();
  await store.set(JSON.stringify(S));SY.ver=v.ver;SY.dirty=false;await saveMeta();lastKey=null;render()}
async function pull(){if(!SY.on)return;
  try{const v=await sapi('GET');
    if(!v){SY.ver=0;SY.dirty=true;return push()}
    if(v.ver>SY.ver){if(SY.dirty&&SY.ver>0)toast('Данные обновлены с другого устройства');await applyRemote(v)}
    else if(SY.dirty)return push();
    SY.status='';SY.lastOk=Date.now()}
  catch(e){SY.status=e.message==='format'||e.name==='OperationError'?'Не удалось расшифровать данные с сервера':syncErr(e)}}
async function push(){if(!SY.on)return;if(SY.busy){SY.again=true;return}SY.busy=true;
  try{const blob=await encStr(SY.dk,JSON.stringify(S)),r=await sapi('PUT',{base:SY.ver,blob});SY.ver=r.ver;SY.dirty=false;SY.status='';SY.lastOk=Date.now()}
  catch(e){if(e.code===409){SY.busy=false;SY.dirty=false;await pull();toast('На другом устройстве были изменения, данные обновлены. Проверьте последнее действие.');return}SY.status=syncErr(e)}
  finally{SY.busy=false;await saveMeta();if(SY.again){SY.again=false;push()}}}
function syncSoon(){if(!SY.on)return;SY.dirty=true;clearTimeout(SY.t);SY.t=setTimeout(()=>push(),1500)}
async function enableSync(){const msg=t=>{const e=$('sy_msg');if(e)e.textContent=t};msg('Включаю защиту…');
  try{const dk=crypto.getRandomValues(new Uint8Array(32)),rc=newRecovery(),wrapped=await wrapDK(dk,rc),blob=await encStr(dk,JSON.stringify(S));
    const r=await sapi('PUT',{base:0,blob,wrapped});await kvSet('k1',b64e(dk));SY={...SY,dk,on:true,ver:r.ver,dirty:false,status:'',lastOk:Date.now()};await saveMeta();showRecovery(rc)}

async function recoverSync(){const e=t=>{$('sy_msg').textContent=t},rc=$('sy_rc').value;if(normRC(rc).length!==24)return e('Код состоит из 24 символов, например ABCD-EFGH-…');e('Проверяю код…');
  try{const v=await sapi('GET');if(!v)return e('На сервере нет данных этого аккаунта');let dk;
    try{dk=await unwrapDK(v.wrapped,rc)}catch(_){return e('Код не подходит. Проверьте буквы и цифры.')}
    await kvSet('k1',b64e(dk));SY={...SY,dk,on:true,ver:0,dirty:false,remote:false};await applyRemote(v);SY.lastOk=Date.now();openSync();hap()}
  catch(x){e(syncErr(x))}}
async function newCode(){try{const rc=newRecovery(),wrapped=await wrapDK(SY.dk,rc),blob=await encStr(SY.dk,JSON.stringify(S)),r=await sapi('PUT',{base:SY.ver,blob,wrapped});SY.ver=r.ver;SY.dirty=false;await saveMeta();showRecovery(rc)}
  catch(e){if(e.code===409){await pull();toast('Данные обновились, попробуйте ещё раз')}else toast(syncErr(e))}}

  try{await sapi('DELETE');await kvDel('k1');await kvDel('m1');SY={...SY,dk:null,on:false,ver:0,dirty:false,remote:false,status:''};openSync()}catch(e){toast(syncErr(e))}}

    +`<button class="btn g" onclick="push().then(openSync)">Синхронизировать сейчас</button><button class="btn g" onclick="newCode()">Новый код восстановления</button>${pts}<button class="btn r" onclick="dropServer(this)">Удалить мои данные с сервера</button>`;

  else body=`<span class="m">Включите, чтобы данные были в безопасности и открывались на любом устройстве.</span>${pts}<button class="btn" onclick="enableSync()">Включить защиту и синхронизацию</button>`;

  const a=id?acc(id):{type:preset||'BANK',initial:0};const debt=DEBT(a.type);
  const iv=debt?Math.max(0,-a.initial):a.initial;
  sheet(`${id?'':`<label>Поиск банка<input id="a_q" placeholder="Например: Сбер, Альфа, ВТБ" oninput="bankChips(this.value)"></label><div id="bl" style="display:flex;flex-wrap:wrap;gap:6px"></div>`}
  <label>Название<input id="a_name" value="${esc(a.name||'')}" placeholder="Например: Сбербанк Visa"></label>
  <label id="a_l4w" style="display:${a.type==='CASH'||a.type==='LOAN'?'none':'flex'}">Последние 4 цифры карты (необязательно)<input id="a_l4" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(a.last4||'')}"></label>
  <label>Тип<select id="a_type" onchange="typeChanged()">${Object.entries(TYPES).map(([k,n])=>`<option value="${k}" ${k===a.type?'selected':''}>${n}</option>`).join('')}</select></label>
  <label><span id="a_il">${debt?'Начальный долг':'Начальный остаток'}</span><input id="a_init" inputmode="decimal" value="${a.initial?plain(Math.abs(iv)):''}" placeholder="0"></label>
  <div id="a_dbt" style="display:${debt?'flex':'none'};flex-direction:column;gap:10px">
  <label id="a_limw" style="display:${a.type==='CARD'?'flex':'none'}">Кредитный лимит<input id="a_lim" inputmode="decimal" value="${a.limit?plain(a.limit):''}"></label>
  <label id="a_origw" style="display:${a.type==='LOAN'?'flex':'none'}">Первоначальная сумма кредита<input id="a_orig" inputmode="decimal" value="${a.orig?plain(a.orig):''}"></label>
  <label><span id="a_payl">Обязательный платёж</span><input id="a_pay" inputmode="decimal" value="${a.pay?plain(a.pay):''}"></label>
  <label>Дата платежа (необязательно)<input id="a_pd" type="date" value="${a.payDate||''}"></label>
  <label>Ставка, %<input id="a_rate" inputmode="decimal" value="${esc(a.rate||'')}"></label>
  <label>Ссылка для оплаты (необязательно)<input id="a_link" inputmode="url" autocapitalize="off" value="${esc(a.link||'')}" placeholder="Страница оплаты или приложение банка"></label>
  <label style="flex-direction:row;align-items:center;gap:8px"><input id="a_est" type="checkbox" style="width:auto" ${a.est?'checked':''}>Остаток долга оценочный</label></div>
  <label>Комментарий<input id="a_c" value="${esc(a.comment||'')}"></label>
  <div id="f_err" class="err"></div><button class="btn" onclick="saveAcc('${id||''}')">Сохранить</button>
  ${id?`<button class="btn r" onclick="archAcc('${id}')">Архивировать</button>`:''}`);
  typeChanged();if(!id)bankChips('');
}
function saveAcc(id){
  const name=$('a_name').value.trim();if(!name)return $('f_err').textContent='Введите название';
  const type=$('a_type').value,l4=String($('a_l4').value||'').trim();if(l4&&!/^\d{4}$/.test(l4))return $('f_err').textContent='Введите ровно 4 последние цифры карты';const lk=validLink($('a_link').value);if(lk===null)return $('f_err').textContent='Проверьте ссылку: например https://online.bank.ru';let init=parse($('a_init').value||'0');
  if(init===null)return $('f_err').textContent='Неверный остаток';
  if(DEBT(type))init=-Math.abs(init);
  const lim=parse($('a_lim').value||'0'),pay=parse($('a_pay').value||'0'),orig=parse($('a_orig').value||'0');
  if(lim===null||pay===null||orig===null)return $('f_err').textContent='Неверная сумма';
  const o={name,type,initial:init,limit:type==='CARD'&&lim||undefined,orig:type==='LOAN'&&orig||undefined,pay:DEBT(type)&&pay||undefined,payDate:DEBT(type)&&$('a_pd').value||undefined,rate:DEBT(type)&&$('a_rate').value||undefined,comment:$('a_c').value,link:DEBT(type)&&lk||undefined,last4:type!=='CASH'&&type!=='LOAN'&&l4||undefined,est:DEBT(type)&&$('a_est').checked};
  if(id)Object.assign(acc(id),o);else S.accounts.push({id:uid(),archived:false,...o});
  save();closeSheet();render();
}
function archAcc(id){if(bal(acc(id))!==0)return $('f_err').textContent='Остаток не нулевой: '+fmt(bal(acc(id)))+'. Сначала переведите его на другой счёт, иначе деньги пропадут из капитала';
  acc(id).archived=true;save();closeSheet();render()}
function editCats(){
  const bt=(t,f)=>`<button class="btn g sm" onclick="${f}">${t}</button>`;
  sheet(`<h2>Категории</h2>`+['OUT','IN'].map(k=>`<span class="m">${k==='OUT'?'Расходы':'Доходы'}</span>`+S.cats.filter(c=>c.kind===k&&!c.archived).map(c=>`<div class="card" style="gap:10px"><div><div>${esc(c.name)}</div>${k==='OUT'&&S.budgets[c.id]?`<span class="m">Лимит ${fmt(S.budgets[c.id])} в месяц</span>`:''}</div>
    <div style="display:grid;grid-template-columns:repeat(${k==='OUT'?3:2},1fr);gap:8px">${k==='OUT'?bt('Лимит',`setBudget('${c.id}')`):''}${bt('Изменить',`renameCat('${c.id}')`)}${bt('В архив',`archCat('${c.id}')`)}</div></div>`).join('')+`<button class="btn g" onclick="addCat('${k}')">Добавить категорию</button>`).join('')+`<button class="lnk" onclick="openArchive(0)">Архив категорий</button><button class="btn" onclick="closeSheet()">Готово</button>`);
}
function nameForm(title,val,cb){sheet(`<label>${title}<input id="n_v" value="${esc(val)}"></label><button class="btn" id="n_ok">Сохранить</button>`);$('n_ok').onclick=()=>{const v=$('n_v').value.trim();if(v)cb(v)}}
function renameCat(id){nameForm('Название',cat(id).name,v=>{cat(id).name=v;save();editCats();render()})}
function addCat(k){nameForm('Название',"",v=>{S.cats.push({id:uid(),kind:k,name:v,archived:false});save();editCats()})}
function archCat(id){cat(id).archived=true;save();editCats()}
function exportCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Дата','Тип','Сумма','Счёт','Куда','Категория','Комментарий'],...S.txs.slice().sort((a,b)=>a.date-b.date).map(t=>[new Date(t.date).toISOString(),{IN:'Доход',OUT:'Расход',TR:'Перевод',ADJ:'Корректировка'}[t.type],(t.amt/100).toFixed(2),acc(t.acc)?.name,acc(t.to)?.name,cat(t.cat)?.name,t.note])];
  const csv=rows.map(r=>r.map(q).join(';')).join('\n');
  sheet(`<h2>Экспорт CSV</h2><textarea id="csv" rows="8" readonly>${esc(csv)}</textarea><button class="btn" id="cp">Скопировать</button><button class="btn g" onclick="closeSheet()">Закрыть</button>`);
  $('cp').onclick=()=>{$('csv').select();try{navigator.clipboard.writeText(csv)}catch(e){document.execCommand('copy')};$('cp').textContent='Скопировано'};
}
function fail(m){$('app').innerHTML=`<div class="card"><b>${m}</b><span class="m">Ваши данные не тронуты. Проверьте интернет и повторите.</span></div><button class="btn" onclick="boot()">Повторить</button>`}
async function boot(){
  try{const s=await store.get();
    if(s){try{S=JSON.parse(s)}catch(e){return fail('Данные не читаются')}}else{S=fresh();save()}
    S.budgets=S.budgets||{};S.goals=S.goals||[];S.learn=S.learn||{};S.bills=S.bills||[];S.settings=S.settings||{};setCur(S.settings.country||'RU');try{localStorage.setItem('fin_country',CUR.country)}catch(e){}if(S.settings.theme){applyTheme(S.settings.theme);try{localStorage.setItem('fin_theme',S.settings.theme)}catch(e){}}
    if(!S.v2){for(const a of S.accounts)if(DEBT(a.type)&&!a.initial&&['Кредитная карта','Кредит'].includes(a.name)&&!S.txs.some(t=>t.acc===a.id||t.to===a.id))a.archived=true;S.v2=1;save()}
    if(!S.v3){const used=a=>S.txs.some(t=>t.acc===a.id||t.to===a.id)||S.goals.some(g=>g.accId===a.id);
      for(const a of S.accounts)if(a.type==='BANK'&&['Сбербанк','Т-Банк','ПСБ'].includes(a.name)&&!a.initial&&!a.comment&&!used(a))a.archived=true;S.v3=1;save()}
    document.querySelector('.fab').style.display='';render();syncInit();
  }catch(e){fail('Не удалось загрузить данные')}}
(function(){const bx=document.getElementById('box');if(!bx||!bx.addEventListener)return;let y0=null,dy=0;
  bx.addEventListener('touchstart',e=>{y0=bx.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
  bx.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){bx.style.transition='none';bx.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}else{dy=0;bx.style.transform=''}},{passive:false});
  bx.addEventListener('touchend',()=>{if(y0==null)return;bx.style.transition='transform .3s var(--ease)';if(dy>110)closeSheet();else bx.style.transform='';y0=null;dy=0},{passive:true})})();

// ===== ИИ помощник =====
const AI={msgs:[],busy:false};
const aiBtn=()=>!(tg&&tg.initData)?'':`<button class="card" style="flex-direction:row;align-items:center;gap:12px;text-align:left;color:var(--text);font:inherit" onclick="openAI()">${ico('spark','#c4b5e8',36)}<span class="apt"><span>ИИ помощник</span><span class="m">Спросите о деньгах или напишите «кофе 300»</span></span></button>`;
const aiR=k=>Math.round(k/100);
function aiContext(){const now=new Date(),L=[];
  L.push('Сегодня: '+dkey(Date.now())+'. Валюта: '+CUR.code+' ('+CUR.sym+').');
  L.push('СЧЕТА (id | название | тип | баланс):');
  for(const a of live())L.push(a.id+' | '+a.name+' | '+SUB[a.type]+' | '+aiR(bal(a)));
  L.push('КАТЕГОРИИ (id | название | расход или доход):');
  for(const c of S.cats.filter(c=>!c.archived))L.push(c.id+' | '+c.name+' | '+(c.kind==='IN'?'доход':'расход'));
  for(let off=0;off>=-2;off--){const[f,t,sd]=mRange(off),by={};let i=0,o=0;
    for(const x of S.txs){if(x.date<f||x.date>=t)continue;if(x.type==='IN')i+=x.amt;if(x.type==='OUT'){o+=x.amt;const n=cat(x.cat)?.name||'Без категории';by[n]=(by[n]||0)+x.amt}}
    L.push('МЕСЯЦ '+ym(sd.getTime())+(off===0?' (текущий, прошло дней: '+now.getDate()+')':'')+': доходы '+aiR(i)+', расходы '+aiR(o)+'. Расходы по категориям: '+(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>n+' '+aiR(v)).join(', ')||'нет'))}
  const B=budgetData();if(B.ids.length)L.push('ЛИМИТЫ на месяц: '+B.ids.map(id=>cat(id).name+' лимит '+aiR(S.budgets[id])+', потрачено '+aiR(B.spent[id]||0)).join('; '));
  if(S.goals.length)L.push('ЦЕЛИ: '+S.goals.map(g=>{const s=gStats(g);return g.name+': '+aiR(s.cur)+' из '+aiR(s.T)+(g.deadline?', срок '+g.deadline:'')}).join('; '));
  const bl=billItems().filter(x=>!x.done);if(bl.length)L.push('НЕОПЛАЧЕННЫЕ ПЛАТЕЖИ МЕСЯЦА: '+bl.map(x=>x.name+' '+aiR(x.amt)+(x.due?' до '+dkey(x.due):'')).join('; '));
  L.push('ПОСЛЕДНИЕ ОПЕРАЦИИ:');
  for(const t of S.txs.slice().sort((a,b)=>b.date-a.date).slice(0,15))L.push(dkey(t.date)+' | '+({IN:'доход',OUT:'расход',TR:'перевод',ADJ:'корректировка'}[t.type])+' | '+aiR(t.amt)+' | '+(t.type==='TR'?(acc(t.acc)?.name||'')+' → '+(acc(t.to)?.name||''):(cat(t.cat)?.name||''))+(t.note?' | '+String(t.note).slice(0,40):''));
  return L.join('\n')}
function openAI(){S.settings=S.settings||{};
  if(!S.settings.aiOk)return sheet(`<div class="ar" style="gap:12px">${ico('spark','#c4b5e8',44)}<h2 style="margin:0">ИИ помощник</h2></div>
  <span>Помощник отвечает на вопросы о ваших деньгах, даёт советы по бюджету и добавляет операции по тексту, например «кофе 300».</span>
  <div class="card" style="gap:8px"><b>Что важно знать</b><span class="m">Чтобы ответить, приложение отправляет ИИ сводку: счета и балансы, суммы по категориям за 3 месяца, цели, лимиты и 15 последних операций.</span><span class="m">Сводка обрабатывается нейросетью на серверах Cloudflare, приложение её не сохраняет. Не пишите в чат паспортные данные, номера карт и пароли.</span><span class="m">Без вашего вопроса никакие данные не отправляются. Историю чата приложение не сохраняет.</span></div>
  <button class="btn" onclick="S.settings.aiOk=1;save();openAI()">Понятно, включить</button><button class="btn g" onclick="closeSheet()">Не сейчас</button><button class="lnk" style="align-self:center" onclick="openPrivacy()">Политика конфиденциальности</button>`);
  sheet(`<div class="row"><div class="ar" style="gap:10px">${ico('spark','#c4b5e8',32)}<h2 style="margin:0">ИИ помощник</h2></div>${AI.msgs.length?`<button class="lnk" onclick="AI.msgs=[];aiDraw()">Очистить</button>`:''}</div>
  <div id="ai_l" style="display:flex;flex-direction:column;gap:8px"></div>
  <div style="display:flex;gap:8px;align-items:flex-end"><textarea id="ai_q" rows="1" placeholder="Вопрос или «такси 450»" style="resize:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}"></textarea><button class="ib" style="width:50px;height:50px;background:var(--accent);color:var(--onacc)" onclick="aiSend()" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
  <span class="m" style="font-size:12px;text-align:center">ИИ может ошибаться. Проверяйте важные цифры.</span>`);
  aiDraw()}
const aiTxt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const AIQ=['Сколько я потратил в этом месяце?','На чём можно сэкономить?','Успеваю ли я к целям?','кофе 300'];
function aiDraw(){const l=$('ai_l');if(!l)return;
  if(!AI.msgs.length){l.innerHTML=`<span class="m">Например:</span>`+AIQ.map(q=>`<button class="api" onclick="aiSend('${esc(q)}')">${esc(q)}</button>`).join('');return}
  l.innerHTML=AI.msgs.map((m,i)=>m.role==='user'?`<div style="align-self:flex-end;max-width:85%;background:var(--accent);color:var(--onacc);border-radius:18px 18px 4px 18px;padding:10px 14px">${aiTxt(m.text)}</div>`
    :`<div style="align-self:flex-start;max-width:92%;display:flex;flex-direction:column;gap:8px"><div class="card" style="border-radius:18px 18px 18px 4px;padding:10px 14px;${m.err?'color:var(--red)':''}">${aiTxt(m.text)}</div>${(m.ops||[]).map((o,j)=>aiOpCard(o,i,j)).join('')}${(m.ops||[]).filter(o=>!o.done).length>1?`<button class="btn" onclick="aiAddAll(${i})">Добавить все</button>`:''}</div>`).join('')
    +(AI.busy?`<div class="card m" style="align-self:flex-start;border-radius:18px 18px 18px 4px;padding:10px 14px">Думаю…</div>`:'');
  const b=$('box');if(b)b.scrollTop=b.scrollHeight}
function aiFix(o){const c=cat(o.cat),kind=o.type==='IN'?'IN':'OUT';
  const cc=c&&!c.archived&&c.kind===kind?c:S.cats.find(x=>x.kind===kind&&!x.archived&&x.name===(kind==='IN'?'Прочие доходы':'Прочие расходы'))||S.cats.find(x=>x.kind===kind&&!x.archived);
  const a0=acc(o.acc),a=a0&&!a0.archived?a0:homeAcc()||live().find(x=>!DEBT(x.type))||live()[0];
  const amt=parse(String(o.amount??'').replace(/[^\d.,]/g,''));
  let date=Date.now();if(/^\d{4}-\d{2}-\d{2}$/.test(o.date||'')&&o.date!==dkey(Date.now())){const[y,m,d]=o.date.split('-').map(Number);date=new Date(y,m-1,d,12,0).getTime()}
  return{type:kind,cat:cc?.id||'',acc:a?.id||'',amt:amt&&amt>0?amt:0,date,note:String(o.note||'').slice(0,120)}}
function aiOpCard(o,i,j){const f=aiFix(o),a=acc(f.acc),c=cat(f.cat),ok=f.amt&&a&&c;
  return `<div class="card" style="gap:6px"><div class="row"><span>${esc(c?.name||'Без категории')}</span><b class="${f.type==='IN'?'pos':''}">${f.type==='IN'?'+':'−'}${fmt(f.amt)}</b></div><span class="m">${dstr(f.date)}${a?', '+esc(a.name):''}${f.note?' · '+esc(f.note):''}</span>${o.done?`<span class="ok">${si('check')} Добавлено</span>`:ok?`<div class="grid"><button class="btn" style="padding:10px" onclick="aiAdd(${i},${j})">Добавить</button><button class="btn g" style="padding:10px" onclick="aiEdit(${i},${j})">Изменить</button></div>`:`<span class="err">Не хватает данных. ${live().length?'':'Сначала добавьте счёт.'}</span>`}</div>`}
function aiAdd(i,j,quiet){const o=AI.msgs[i].ops[j];if(o.done)return;const f=aiFix(o);if(!f.amt||!acc(f.acc)||!cat(f.cat))return;
  S.txs.push({id:uid(),type:f.type,acc:f.acc,cat:f.cat,amt:f.amt,date:f.date,note:f.note});o.done=1;
  if(!quiet){save();render();hap();aiDraw()}}
function aiAddAll(i){AI.msgs[i].ops.forEach((_,j)=>aiAdd(i,j,1));save();render();hap();aiDraw()}
function aiEdit(i,j){const f=aiFix(AI.msgs[i].ops[j]);closeSheet();setTimeout(()=>txForm({type:f.type,amt:f.amt,date:f.date,note:f.note,cat:f.cat,acc:f.acc},null),280)}
async function aiSend(q){const inp=$('ai_q');q=String(q??(inp?inp.value:'')).trim();if(!q||AI.busy)return;if(inp)inp.value='';
  AI.msgs.push({role:'user',text:q});
  if(!AI_URL){AI.msgs.push({role:'model',text:'Помощник ещё не подключён: не указан адрес сервера ИИ.',err:1});return aiDraw()}
  AI.busy=true;aiDraw();
  try{const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:(tg&&tg.initData)||'',context:aiContext(),messages:AI.msgs.filter(m=>!m.err).slice(-10).map(m=>({role:m.role,text:m.text}))})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)AI.msgs.push({role:'model',text:d.error||'Ошибка сервера ('+r.status+')',err:1});
    else AI.msgs.push({role:'model',text:d.reply||'Нет ответа',ops:(d.ops||[]).filter(o=>o&&(o.type==='IN'||o.type==='OUT'))})}
  catch(e){AI.msgs.push({role:'model',text:'Нет связи с помощником. Проверьте интернет.',err:1})}
  AI.busy=false;aiDraw()}

boot();
if(!IN_TG&&'serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
